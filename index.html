<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#211d1b"><link rel="manifest" href="manifest.webmanifest">
<title>Fit Calendar 3.0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1ee;color:#292321;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:680px;margin:auto;padding:12px 14px 80px}.hero{background:linear-gradient(145deg,#211d1b,#92766a);color:white;border-radius:26px;padding:22px;margin-bottom:12px}.top{display:flex;justify-content:space-between}.hero h1{margin:0;font-size:28px}.hero p{margin:5px 0;opacity:.8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:15px}.stat{background:#ffffff18;border-radius:13px;padding:8px;text-align:center}.stat b{display:block;font-size:18px}.stat small{font-size:9px}.tabs{display:flex;gap:7px;margin:12px 0}.tab{border:0;background:#e8dfda;padding:11px 13px;border-radius:13px;font-weight:700}.tab.active{background:#292321;color:white}.panel{display:none}.panel.active{display:block}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{border:0;background:white;border-radius:12px;padding:9px 2px}.day small{display:block;color:#92766a}.day.done{background:#708775;color:white}.card{background:white;border-radius:21px;padding:16px;margin:11px 0;box-shadow:0 3px 15px #0000000a}.head{display:flex;justify-content:space-between}.eyebrow{font-size:10px;letter-spacing:1px;color:#92766a;font-weight:800}.card h2{margin:5px 0 12px;font-size:20px}.check{width:44px;height:44px;border:0;border-radius:50%;background:#eee7e2;font-size:22px}.check.done{background:#708775;color:white}
.exercise{border:1px solid #e6ddd8;border-radius:15px;margin:8px 0;overflow:hidden}.exline{display:flex;gap:7px;padding:9px}.exopen{flex:1;text-align:left;border:0;background:transparent}.exopen b{display:block}.exopen span{color:#8a7d75;font-size:12px}.vid{border:0;border-radius:10px;background:#292321;color:white;padding:0 11px}.details{display:none;background:#f7f3f0;padding:11px;border-top:1px solid #e6ddd8}.details.open{display:block}.fields{display:grid;grid-template-columns:1fr 1fr;gap:7px}.fields input,.editor input,.editor select{width:100%;border:1px solid #ddd2cc;border-radius:11px;padding:10px;background:white}.action{width:100%;border:0;border-radius:13px;padding:13px;background:#292321;color:white;font-weight:800;margin-top:8px}.secondary{background:#eee7e2;color:#292321}.mini{border:0;border-radius:9px;padding:8px;background:#eee7e2}.row{display:flex;gap:7px}.share{word-break:break-all;background:#f0e8e3;border-radius:13px;padding:10px;margin-top:8px;font-size:11px}.timer{position:fixed;bottom:15px;left:14px;right:14px;max-width:650px;margin:auto;background:#292321;color:white;border-radius:20px;padding:12px;text-align:center;display:none}.timer b{font-size:28px;display:block}.notice{font-size:12px;color:#756860;line-height:1.4}
</style></head><body><div class="app">
<header class="hero"><div class="top"><div><h1>Fit Calendar <small>3.0</small></h1><p id="sub">Персональная программа</p></div><button class="mini" onclick="tab('editor')">⚙️</button></div>
<div class="stats"><div class="stat"><b id="doneN">0</b><small>ТРЕНИРОВОК</small></div><div class="stat"><b id="streak">0</b><small>СЕРИЯ 🔥</small></div><div class="stat"><b id="pct">0%</b><small>ПРОГРЕСС</small></div></div></header>
<nav class="tabs"><button class="tab active" onclick="tab('home')">📅 Календарь</button><button class="tab" onclick="tab('today')">▶️ Сегодня</button><button class="tab" onclick="tab('editor')">⚙️ Редактор</button></nav>
<section id="home" class="panel active"><div id="cal" class="calendar"></div><div id="cards"></div></section>
<section id="today" class="panel"><div id="todayBox"></div></section>
<section id="editor" class="panel editor">
<div class="card"><h2>👤 Персональная программа</h2><input id="client" placeholder="Имя девушки / название программы"><p class="notice">Для каждой девушки можно создать свою программу и отдельную ссылку. Её прогресс, веса и повторы сохраняются на её устройстве.</p><button class="action" onclick="share()">🔗 Создать ссылку для этой программы</button><div id="shareBox"></div></div>
<div class="card"><h2>➕ Новый тренировочный день</h2><div class="row"><select id="newDay"></select><input id="newTitle" placeholder="Название тренировки"></div><button class="action secondary" onclick="addDay()">Добавить</button></div>
<div id="edit"></div>
</section></div><div id="timer" class="timer">Отдых <b id="tv">60</b><button class="mini" onclick="stopTimer()">Закрыть</button></div>
<script>
const KEY='fit3';const base={name:'Персональная программа',workouts:{1:{title:'🍑 Ягодицы + ноги',ex:[['Hip Thrust','4 × 8–12'],['Присед в Смите','3 × 8–12'],['Жим ногами','3 × 10–12'],['Румынская тяга','3 × 10–12']]},3:{title:'💪 Верх тела',ex:[['Тяга верхнего блока','3 × 10–12'],['Горизонтальная тяга','3 × 10–12'],['Жим гантелей сидя','3 × 8–12']]},5:{title:'🔥 Ягодицы + бёдра',ex:[['Ягодичный мост','4 × 10–12'],['Болгарские выпады','3 × 8–10 / нога'],['Сгибание ног','3 × 10–15']]}}};
let plan=readPlan(),done=JSON.parse(localStorage.getItem(KEY+'done')||'{}'),vals=JSON.parse(localStorage.getItem(KEY+'vals')||'{}');
function readPlan(){try{if(location.hash)return JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))))}catch(e){}try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(base)}catch(e){return structuredClone(base)}}
function save(){localStorage.setItem(KEY,JSON.stringify(plan));localStorage.setItem(KEY+'done',JSON.stringify(done));localStorage.setItem(KEY+'vals',JSON.stringify(vals))}
function tab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='home')render();if(id==='today')today();if(id==='editor')editor()}
function render(){document.getElementById('sub').textContent=(plan.name||'Персональная программа')+' · сентябрь 2026';let c='',cards='';for(let d=1;d<=30;d++){let w=plan.workouts[d],yes=!!done[d];c+=`<button class="day ${yes?'done':''}" onclick="go(${d})"><b>${d}</b><small>${w?'🔥':'·'}</small></button>`;if(w)cards+=card(d,w)}document.getElementById('cal').innerHTML=c;document.getElementById('cards').innerHTML=cards;stats()}
function card(d,w){let yes=!!done[d];return `<div class="card" id="d${d}"><div class="head"><div><div class="eyebrow">${d} СЕНТЯБРЯ</div><h2>${esc(w.title)}</h2></div><button class="check ${yes?'done':''}" onclick="finish(${d})">${yes?'✓':'○'}</button></div>${w.ex.map((e,i)=>ex(d,i,e)).join('')}<button class="action ${yes?'secondary':''}" onclick="finish(${d})">${yes?'✓ Выполнено':'✓ Завершить тренировку'}</button></div>`}
function ex(d,i,e){let k=d+'_'+i,v=vals[k]||{};return `<div class="exercise"><div class="exline"><button class="exopen" onclick="document.getElementById('i${k}').classList.toggle('open')"><b>${esc(e[0])}</b><span>${esc(e[1])}</span></button><a class="vid" target="_blank" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[0]+' proper form')}">▶</a></div><div id="i${k}" class="details"><div class="fields"><input placeholder="Вес, кг" value="${esc(v.w||'')}" onchange="setv('${k}','w',this.value)"><input placeholder="Повторы" value="${esc(v.r||'')}" onchange="setv('${k}','r',this.value)"></div><br><button class="mini" onclick="timer(60)">⏱ 60 сек</button> <button class="mini" onclick="timer(90)">⏱ 90 сек</button></div></div>`}
function finish(d){done[d]=!done[d];save();render()}
function setv(k,f,v){vals[k]=vals[k]||{};vals[k][f]=v;save()}
function go(d){let x=document.getElementById('d'+d);if(x)x.scrollIntoView({behavior:'smooth'})}
function stats(){let ds=Object.keys(plan.workouts).map(Number),n=ds.filter(d=>done[d]).length;doneN.textContent=n;pct.textContent=(ds.length?Math.round(n/ds.length*100):0)+'%';let s=0;for(let d=30;d>=1;d--){if(done[d])s++;else if(s)break}streak.textContent=s}
function today(){let d=new Date().getMonth()===8?new Date().getDate():1;todayBox.innerHTML=plan.workouts[d]?card(d,plan.workouts[d]):'<div class="card"><h2>Сегодня восстановление 😴</h2><p class="notice">Прогулка и лёгкая мобильность.</p></div>'}
function editor(){client.value=plan.name||'';newDay.innerHTML=Array.from({length:30},(_,i)=>`<option value="${i+1}">${i+1} сентября</option>`).join('');let o='';Object.keys(plan.workouts).sort((a,b)=>a-b).forEach(d=>{let w=plan.workouts[d];o+=`<div class="card"><div class="head"><div><div class="eyebrow">${d} СЕНТЯБРЯ</div><h2>${esc(w.title)}</h2></div><button class="mini" onclick="delDay(${d})">Удалить</button></div>${w.ex.map((e,i)=>`<div class="exercise"><div class="exline"><button class="exopen" onclick="editEx(${d},${i})"><b>${esc(e[0])}</b><span>${esc(e[1])}</span></button><button class="mini" onclick="delEx(${d},${i})">×</button></div></div>`).join('')}<button class="action secondary" onclick="addEx(${d})">＋ Добавить упражнение</button></div>`});edit.innerHTML=o}
client.oninput=()=>{plan.name=client.value||'Персональная программа';save();sub.textContent=plan.name+' · сентябрь 2026'}
function addDay(){let d=+newDay.value,t=newTitle.value.trim()||'Новая тренировка';plan.workouts[d]={title:t,ex:[]};save();editor();render()}
function addEx(d){let n=prompt('Название упражнения');if(!n)return;let s=prompt('Подходы × повторения','3 × 12')||'3 × 12';plan.workouts[d].ex.push([n,s]);save();editor();render()}
function editEx(d,i){let e=plan.workouts[d].ex[i],n=prompt('Название',e[0]);if(n===null)return;let s=prompt('Подходы × повторения',e[1])||e[1];plan.workouts[d].ex[i]=[n,s];save();editor();render()}
function delEx(d,i){if(confirm('Удалить упражнение?')){plan.workouts[d].ex.splice(i,1);save();editor();render()}}
function delDay(d){if(confirm('Удалить тренировочный день?')){delete plan.workouts[d];delete done[d];save();editor();render()}}
function share(){let enc=btoa(unescape(encodeURIComponent(JSON.stringify(plan)))),u=location.href.split('#')[0]+'#'+enc;shareBox.innerHTML=`<div class="share">${u}</div><button class="action" onclick="navigator.clipboard.writeText('${u}');alert('Ссылка скопирована')">📋 Скопировать</button>`}
function timer(s){clearInterval(window.ti);let n=s;document.getElementById('timer').style.display='block';tv.textContent=n;window.ti=setInterval(()=>{tv.textContent=--n;if(n<=0){clearInterval(window.ti);tv.textContent='Готово! 🔥'}},1000)}
function stopTimer(){clearInterval(window.ti);document.getElementById('timer').style.display='none'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();editor();
</script></body></html>
